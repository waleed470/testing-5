service: ibs-app-part2

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    STAGE: ${env:STAGE, 'dev'}
    SNS_TOPIC_ARN: { Ref: MySNSTopic }

resources:
  Resources:
    MySNSTopic:
      Type: AWS::SNS::Topic
      # Properties section COMPLETELY REMOVE KARDO
      # Serverless automatically unique name generate karega

functions:
  processData:
    handler: handlers/processor.handler
    events:
      - sns: MySNSTopic