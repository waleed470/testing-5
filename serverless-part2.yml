service: ibs-app-part2

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    STAGE: ${env:STAGE, 'dev'}

functions:
  processData:
    handler: handlers/processor.handler
    # SNS event completely remove karo
    events:
      - http:  # Simple HTTP endpoint bana do
          path: /process
          method: post
          cors: true
plugins:
  - serverless-prune-plugin