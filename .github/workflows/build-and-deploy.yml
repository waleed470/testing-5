name: Serverless Build and Deploy

on:
  push:
    branches: [f1, f2, f3, f4, f5, f6, f7, f8, f9, dev]

jobs:
  deploy_part1:
    name: Deploy Part 1
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/dev'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            echo '{
              "name": "ibs-multi-service-app",
              "version": "1.0.0",
              "description": "Multi-part serverless application",
              "dependencies": {
                "pg": "^8.11.3",
                "aws-sdk": "^2.1494.0"
              },
              "devDependencies": {
                "serverless": "^3.35.0"
              }
            }' > package.json
          fi
          npm install --no-package-lock pg@^8.11.3 aws-sdk@^2.1494.0
          npm install --no-package-lock -g serverless@3.35.0
          echo '{"name": "ibs-app", "version": "1.0.0", "lockfileVersion": 3}' > package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Extract Branch Name
        id: extract_branch
        run: |
          branch=${GITHUB_REF#refs/heads/}
          echo "Branch is $branch"
          if [[ "$branch" == "dev" ]]; then
            echo "STAGE=develop" >> $GITHUB_ENV
          elif [[ "$branch" =~ ^f[0-9]+$ ]]; then
            echo "STAGE=feature${branch#f}" >> $GITHUB_ENV
          else
            echo "STAGE=$branch" >> $GITHUB_ENV
          fi
          echo "Using stage: $STAGE"

      - name: Deploy Part 1
        run: sls deploy --stage $STAGE --verbose -c serverless-part1.yml
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}

  deploy_part2:
    name: Deploy Part 2
    runs-on: ubuntu-latest
    needs: deploy_part1  # PART 1 KE BAAD HI RUN HOGA
    if: github.ref != 'refs/heads/dev'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install --no-package-lock pg@^8.11.3 aws-sdk@^2.1494.0
          npm install --no-package-lock -g serverless@3.35.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Extract Branch Name
        run: |
          branch=${GITHUB_REF#refs/heads/}
          if [[ "$branch" =~ ^f[0-9]+$ ]]; then
            echo "STAGE=feature${branch#f}" >> $GITHUB_ENV
          fi

      - name: Deploy Part 2
        run: sls deploy --stage $STAGE --verbose -c serverless-part2.yml

  deploy_part3:
    name: Deploy Part 3
    runs-on: ubuntu-latest
    needs: deploy_part2  # PART 2 KE BAAD HI RUN HOGA
    if: github.ref != 'refs/heads/dev'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install --no-package-lock pg@^8.11.3 aws-sdk@^2.1494.0
          npm install --no-package-lock -g serverless@3.35.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Extract Branch Name
        run: |
          branch=${GITHUB_REF#refs/heads/}
          if [[ "$branch" =~ ^f[0-9]+$ ]]; then
            echo "STAGE=feature${branch#f}" >> $GITHUB_ENV
          fi

      - name: Deploy Part 3
        run: sls deploy --stage $STAGE --verbose -c serverless-part3.yml