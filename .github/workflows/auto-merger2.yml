name: Auto Merge Branch2

on:
  push:
    branches:
      - dev

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sequential_merges:
    name: Sequential Branch Merging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    
    steps:
      - uses: actions/checkout@v4

      - name: Merge dev -> f1
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f1
          message: Merge dev into f1
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f1 deployment
        run: |
          echo "Waiting for f1 deployment to complete..."
          sleep 300  # 5 minutes wait for f1 deployment

      - name: Merge dev -> f2
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f2
          message: Merge dev into f2
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f2 deployment
        run: |
          echo "Waiting for f2 deployment to complete..."
          sleep 300  # 5 minutes wait for f2 deployment

      - name: Merge dev -> f3
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f3
          message: Merge dev into f3
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f3 deployment
        run: |
          echo "Waiting for f3 deployment to complete..."
          sleep 300  # 5 minutes wait for f3 deployment

      - name: Merge dev -> f4
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f4
          message: Merge dev into f4
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f4 deployment
        run: |
          echo "Waiting for f4 deployment to complete..."
          sleep 300  # 5 minutes wait for f4 deployment

      - name: Merge dev -> f5
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f5
          message: Merge dev into f5
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f5 deployment
        run: |
          echo "Waiting for f5 deployment to complete..."
          sleep 300  # 5 minutes wait for f5 deployment

      - name: Merge dev -> f6
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f6
          message: Merge dev into f6
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f6 deployment
        run: |
          echo "Waiting for f6 deployment to complete..."
          sleep 300  # 5 minutes wait for f6 deployment

      - name: Merge dev -> f7
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f7
          message: Merge dev into f7
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f7 deployment
        run: |
          echo "Waiting for f7 deployment to complete..."
          sleep 300  # 5 minutes wait for f7 deployment

      - name: Merge dev -> f8
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f8
          message: Merge dev into f8
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f8 deployment
        run: |
          echo "Waiting for f8 deployment to complete..."
          sleep 300  # 5 minutes wait for f8 deployment

      - name: Merge dev -> f9
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: dev
          target_branch: f9
          message: Merge dev into f9
          github_token: ${{ secrets.GH_AUTO_MERGER }}

      - name: Wait for f9 deployment
        run: |
          echo "Waiting for f9 deployment to complete..."
          sleep 300  # 5 minutes wait for f9 deployment

      - name: All deployments completed
        run: |
          echo "✅ All branches (f1 to f9) have been sequentially merged and deployed!"