service: ibs-app-part1

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    STAGE: ${env:STAGE, 'dev'}
    DB_HOST: ${env:DB_HOST}
    DB_NAME: ${env:DB_NAME}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_USERNAME: ${env:DB_USERNAME}

functions:
  apiHandler:
    handler: handlers/api.handler
    events:
      - http:
          path: /data
          method: post
          cors: true
plugins:
  - serverless-prune-plugin
